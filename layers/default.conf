[ids]
*

[global]
overload_tap_timeout = 200

# ══════════════════════════════════════════════════════════════
# MAIN LAYER
# ══════════════════════════════════════════════════════════════
[main]

# Capslock → Esc (tap) / Move layer (hold)
capslock = overload(move, esc)

# Home row mods — left hand (Meta / Alt / Shift / Ctrl)
a = lettermod(meta, a, 150, 200)
s = lettermod(alt, s, 150, 200)
d = lettermod(shift, d, 150, 200)
f = lettermod(control, f, 150, 200)

# Home row mods — right hand (Ctrl / Shift / Alt / Meta)
j = lettermod(control, j, 150, 200)
k = lettermod(shift, k, 150, 200)
l = lettermod(alt, l, 150, 200)
; = lettermod(meta, ;, 150, 200)


# ══════════════════════════════════════════════════════════════
# MOVE LAYER — Capslock hold
# ══════════════════════════════════════════════════════════════
[move]

# Arrow keys
h = left
j = down
k = up
l = right

# Word jumps
u = C-left
o = C-right

# Editing
space = backspace
n = C-backspace
, = delete
. = A-d
g = enter

# Disable home row mod fallthrough
a = a
s = s
d = d
f = f
; = ;
