# Commands and Apps to be executed at launch (vendor defaults)
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper=""
$wallDIR = $HOME/Pictures/wallpapers  # change path manually here if needed

### wallpaper stuff ###
exec-once = awww-daemon --format xrgb
#exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop" $livewallpaper
# wallpaper random
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

### Startup ###
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = $HOME/.config/hypr/scripts/Dropterminal.sh kitty &
exec-once = $scriptsDir/Polkit.sh
# Disabled — waybar has native network module + rofi-network-manager on-click
# exec-once = nm-applet --indicator
# exec-once = nm-tray   # For ubuntu only - conflicts with nm-applet on Arch, keep disabled
exec-once = swaync
#exec-once = ags
#exec-once = blueman-applet
#exec-once = rog-control-center
exec-once = waybar -c $HOME/.config/waybar/config          # bar on eDP-1 (laptop screen)
#exec-once = sleep 1 && waybar -c $HOME/.config/waybar/config-hdmi   # bar on HDMI-A-1 (external)
# Disabled — runs ~20% CPU continuously for an on-demand feature.
# Super+A overview falls back to AGS automatically when this isn't running.
# exec-once = qs -c overview  # Quickshell Overview (single launch)
exec-once = hypridle
exec-once = $scriptsDir/Hyprsunset.sh init

# Clipboard manager
exec-once = clipse -listen

# Rainbow borders (disabled by default; use quick settings menu)
#exec-once = $UserScripts/RainbowBorders.sh


# Here are list of features available but disabled by default
# Persistent wallpaper
# exec-once = awww-daemon --format xrgb && awww img $wallDIR/mecha-nostalgia.png

# Gnome polkit for NixOS
#exec-once = $scriptsDir/Polkit-NixOS.sh

# xdg-desktop-portal-hyprland (should be auto starting. However, you can force to start)
#exec-once = $scriptsDir/PortalHyprland.sh
exec-once = rog-control-center
# Disabled — waybar has native bluetooth module + overskride on-click
# exec-once = blueman-applet
# qs -c overview is already launched above (line 28) - removed duplicate
exec-once = $scriptsDir/KeybindsLayoutInit.sh
